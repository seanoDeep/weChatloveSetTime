# 微信守护女友配置文件
# 推荐使用图形界面修改: python ui_config.py

[configuration]

# 设置女友的微信名称，记住，不是微信ID也不是微信备注
my_lady_wechat_name = 司难木载

# 全局静默开关: 1=完全不输出任何控制台日志，0=正常输出
silent_mode = 0

# 女友生日月份(两位数)，99=不启用
birthday_month = 03

# 女友生日日期(两位数)，99=不启用
birthday_day = 18

# 早上起床问候时间 HH:MM，99:99=不启用
say_good_morning = 10:50

# 中午吃饭问候时间 HH:MM，99:99=不启用
say_good_lunch = 10:51

# 晚上吃饭问候时间 HH:MM，99:99=不启用
say_good_dinner = 10:52

# 晚上睡觉问候时间 HH:MM，99:99=不启用
say_good_dream = 10:53

# 睡觉问候是否附带每日学英语: 1=是，0=否
flag_learn_english = 1

# 所有问候语结尾是否加随机表情: 1=是，0=否
flag_wx_emoj = 1

# 情人节祝福语
str_Valentine = 亲爱的，情人节快乐！我想和你一起分享生命中的每一天，直到永远。

# 三八妇女节祝福语
str_Women = 嘿，女神节到了，祝我的女神开心快乐！你每天都是那么好看^_^

# 平安夜祝福语
str_Christmas_Eve = 宝贝，平安夜快乐，你吃苹果了吗？n(*≧▽≦*)n

# 圣诞节祝福语
str_Christmas = 小仙女，圣诞节快乐哦！（づ￣3￣）づ╭❤～

# 生日祝福语
str_birthday = 亲爱的，生日快乐，我已经给你准备好了礼物哦，明天你就能看到啦！(*@ο@*) 哇～


[custom_tasks]

# ============================================================
# 自定义定时任务。每项包含:
#   taskN_time     触发时间 HH:MM
#   taskN_mode     custom(自定义内容) / dict(从默认字典随机)
#   taskN_content  mode=custom 时必填
#   taskN_dict     morning|lunch|dinner|dream|emoj|all
#   taskN_receiver 接收人微信昵称，缺省=女友昵称
# ============================================================

task1_time = 16:10
task1_mode = custom
task1_content = 小提醒：该起身活动一下啦，别久坐哦~
task1_receiver = 司难木载

task2_time = 16:15
task2_mode = dict
task2_dict = all
task2_receiver = 司难木载


# ============================================================
# 运行参数（UI 配置窗口写入，也可手动修改）
# ============================================================
[runtime]

# 要守护的应用路径；留空=使用内置 say_to_lady.py
app_path = 

# 运行模式: daemon=后台守护 / console=前台控制台
run_mode = daemon

# 本地健康检查端口 0-65535，0=不启用
health_port = 0

# 后台保持活跃(阻止系统休眠): 1=开，0=关
keep_awake = 1

# 进程守护(异常退出自动重启): 1=开，0=关
watchdog = 1

# 守护轮询间隔(秒)，建议 2-30
watchdog_interval = 5

# 每小时最大重启次数，超过后降速等待
max_restarts_per_hour = 20

# 开机自启动: 1=开，0=关（保存配置时同步到系统）
autostart = 0
